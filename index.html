<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint IDE</title>
<style>
  :root {
    --bg-dark: #0a0a0c;
    --bg-panel: #111215;
    --bg-header: #16181d;
    --accent-blue: #5c9dff;
    --accent-green: #39d353;
    --accent-red: #f85149;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --border: #262c36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Buttons */
  button { background: #1c2128; color: var(--text-main); border: 1px solid var(--border); padding: 4px 9px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; transition: 0.15s; }
  button:hover:not(:disabled) { background: #2d333b; border-color: #444c56; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: #238636; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
  button.primary:hover:not(:disabled) { background: #2ea043; }
  button.danger { color: var(--accent-red); border-color: rgba(248,81,73,0.25); background: rgba(248,81,73,0.08); }
  button.danger:hover:not(:disabled) { background: rgba(248,81,73,0.18); border-color: var(--accent-red); }
  
  /* Layout */
  #login-screen { display: none !important; }
  #app-layout { display: flex; flex-direction: column; height: 100vh; }
  
  #header { height: 34px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; justify-content: space-between; flex-shrink: 0; gap: 8px; }
  .brand-tag { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.5px; padding-right: 6px; border-right: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
  .header-group { display: flex; gap: 6px; align-items: center; min-width: 0; }
  select { background: #0d1117; color: #fff; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-size: 11px; outline: none; height: 24px; max-width: 150px; }

  #workspace { display: flex; flex: 1; min-height: 0; }
  
  /* Sidebar */
  #sidebar { width: 170px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 4px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  #file-tree { flex: 1; overflow-y: auto; padding: 4px 0; }
  .file-item { padding: 3px 8px; overflow: hidden; white-space: nowrap; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-muted); user-select: none; border-left: 2px solid transparent; }
  .file-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .file-item.active { background: rgba(92,157,255,0.12); color: var(--accent-blue); border-left-color: var(--accent-blue); }

  /* Main Editor Area */
  #main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #editor-tabs { height: 30px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 6px; gap: 4px; flex-shrink: 0; }
  .tab-group { display: flex; background: #0a0a0c; border: 1px solid var(--border); border-radius: 4px; padding: 2px; gap: 2px; }
  .tab-btn { background: transparent; border: none; padding: 3px 8px; color: var(--text-muted); border-radius: 3px; font-size: 11px; font-weight: 500; }
  .tab-btn.active { color: #fff; background: #21262d; }
  
  #view-container { flex: 1; position: relative; display: flex; min-height: 0; }
  #code-editor { position: absolute; inset: 0; width: 100%; height: 100%; background: #0a0a0c; color: #e6edf3; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.45; padding: 8px 10px; border: none; resize: none; outline: none; display: none; tab-size: 2; }
  #preview-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #fff; display: block; }
  
  /* Console */
  #console-panel { height: 96px; background: #0d1117; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #console-header { padding: 3px 8px; background: #161b22; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  #console-logs { flex: 1; overflow-y: auto; padding: 6px 10px; font-family: monospace; font-size: 10px; line-height: 1.35; color: #e6edf3; }
  .log-err { color: #ff7b72; margin-bottom: 2px; border-left: 2px solid #ff7b72; padding: 2px 6px; background: rgba(255,123,114,0.1); border-radius: 2px; }
  .log-info { color: var(--accent-blue); margin-bottom: 2px; }
  .log-success { color: var(--accent-green); margin-bottom: 2px; }
  
  /* Overlays & Utilities */
  #toast { position: fixed; bottom: 16px; right: 16px; background: var(--bg-panel); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 500; transform: translateY(80px); opacity: 0; transition: 0.25s; z-index: 10000; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  #toast.show { transform: translateY(0); opacity: 1; }
  .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; background: var(--bg-dark); font-size: 12px; color: var(--text-muted); pointer-events: none; text-align: center; line-height: 1.4; padding: 20px; }
    #sidebar.collapsed { display: none; }
    #user-display { font-size: 11px; color: var(--text-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.ai-btn { background: var(--accent-blue); color: #fff; font-size: 10px; font-weight: 600; padding: 3px 9px; border: 1px solid rgba(255,255,255,0.1); }
    button.ai-btn:hover:not(:disabled) { background: #7ab1ff; border-color: rgba(255,255,255,0.25); }
    button.icon-btn { padding: 3px 7px; font-size: 12px; line-height: 1; }
    button.mini { padding: 2px 7px; font-size: 10px; }
    #current-file-label { font-size: 11px; color: var(--text-muted); margin-left: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #current-file-label.dirty { color: #e3b341; }
    .badge { background: var(--accent-red); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 9px; font-weight: 700; margin-left: 6px; }
    .console-actions { display: flex; gap: 4px; }
    .fi-icon { flex-shrink: 0; font-size: 11px; }
    .fi-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .fi-dir { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #5b6470; font-size: 9px; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
<div id="login-screen">
  <h2>Sprint IDE</h2>
  <p style="color: var(--text-muted); font-size: 14px;">Log in to authenticate your GitHub deployment pipeline.</p>
  <button id="btn-login" class="primary" style="padding: 12px 24px; font-size: 14px;">Sign in with GitHub</button>
</div>

<!-- Main App Layout -->
<div id="app-layout">
  <div id="header">
    <div class="header-group">
          <span class="brand-tag">⚡ SPRINT IDE</span>
      <select id="repo-select" title="Select Repository"><option value="">Loading Repos...</option></select>
      <button id="btn-new-repo" title="Create New Repository">➕ New</button>
      <button id="btn-live-site" style="display:none;" title="Open live GitHub Pages deployment">🌐 Live</button>
    </div>
    <div class="header-group">
          <span id="user-display" title="GitHub user (signed in)"></span>
      <button id="btn-push" class="primary" disabled title="Commit and deploy changes">💾 Push</button>
      <button id="btn-logout" class="danger">Logout</button>
    </div>
  </div>

  <div id="workspace">
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Explorer</span>
        <button id="btn-new-file" class="mini" title="Create a new file in this repo">+ File</button>
      </div>
      <div id="file-tree"></div>
    </div>
    
    <div id="main-area">
      <div id="editor-tabs">
              <button id="btn-toggle-sidebar" class="icon-btn" title="Show / hide Explorer">☰</button>
              <div class="tab-group">
          <button id="tab-preview" class="tab-btn active">Preview</button>
          <button id="tab-code" class="tab-btn">Code</button>
                  </div>
                  <span id="current-file-label">No file open</span>
                  <div style="flex:1;"></div>
        <button id="btn-paste-ai" class="ai-btn" title="Apply an AI patch from the clipboard (Ctrl+Shift+V)">⚡ Paste AI Fix</button>
      </div>
      
      <div id="view-container">
        <div id="empty-watermark" class="watermark">Generate your app with AI,<br>copy the code, and click 'Paste AI Fix'</div>
        <textarea id="code-editor" spellcheck="false" readonly></textarea>
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
      </div>
      
      <div id="console-panel">
        <div id="console-header">
          <span>Terminal / Error Logs<span id="err-count" class="badge" style="display:none;">0</span></span>
                    <div class="console-actions">
                      <button id="btn-clear-logs" class="mini" title="Clear all logs">Clear</button>
                      <button id="btn-copy-errors" class="mini" title="Copy errors as a ready-to-paste AI prompt">Copy Logs for AI</button>
                    </div>
        </div>
        <div id="console-logs"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GithubAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCsN9OHN4SKKzMvaUnWPGUHK4VrJICL-Eo",
    authDomain: "ghub-fcc39.firebaseapp.com",
    projectId: "ghub-fcc39"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GithubAuthProvider();
  provider.addScope('repo'); // Required to read/write repositories

  // State
  let ghToken = '';
  let ghUser = '';
  let currentRepo = '';
  let currentFile = '';
  let sourceContent = '';
  let fileTree = [];

  // DOM Elements
  const ui = {
    loginScreen: document.getElementById('login-screen'),
    appLayout: document.getElementById('app-layout'),
    btnLogin: document.getElementById('btn-login'),
    btnLogout: document.getElementById('btn-logout'),
    userDisplay: document.getElementById('user-display'),
    repoSelect: document.getElementById('repo-select'),
    btnNewRepo: document.getElementById('btn-new-repo'),
    btnPush: document.getElementById('btn-push'),
    btnPasteAi: document.getElementById('btn-paste-ai'),
    btnLiveSite: document.getElementById('btn-live-site'),
    btnNewFile: document.getElementById('btn-new-file'),
    fileTree: document.getElementById('file-tree'),
    tabPreview: document.getElementById('tab-preview'),
    tabCode: document.getElementById('tab-code'),
    codeEditor: document.getElementById('code-editor'),
    previewFrame: document.getElementById('preview-frame'),
    watermark: document.getElementById('empty-watermark'),
    consoleLogs: document.getElementById('console-logs'),
    btnCopyErrors: document.getElementById('btn-copy-errors'),
        btnClearLogs: document.getElementById('btn-clear-logs'),
        errCount: document.getElementById('err-count'),
        sidebar: document.getElementById('sidebar'),
        btnToggleSidebar: document.getElementById('btn-toggle-sidebar'),
        fileLabel: document.getElementById('current-file-label'),
        toast: document.getElementById('toast')
  };

  // Utilities
  function showToast(msg, isError = false) {
    ui.toast.textContent = msg;
    ui.toast.style.borderColor = isError ? 'var(--accent-red)' : 'var(--border)';
    ui.toast.classList.add('show');
    setTimeout(() => ui.toast.classList.remove('show'), 3000);
  }

  function log(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `log-${type}`;
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    ui.consoleLogs.appendChild(el);
        ui.consoleLogs.scrollTop = ui.consoleLogs.scrollHeight;
        if (type === 'err') updateErrCount();
      }

      function updateErrCount() {
        const n = ui.consoleLogs.querySelectorAll('.log-err').length;
        ui.errCount.textContent = n;
        ui.errCount.style.display = n ? 'inline-block' : 'none';
      }

      function setDirty(flag) {
        ui.fileLabel.textContent = currentFile ? currentFile + (flag ? ' ●' : '') : 'No file open';
        ui.fileLabel.classList.toggle('dirty', !!flag);
      }

  function unicodeToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function base64ToUnicode(b64) {
    return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
  }

  // Auth Flow
  ui.btnLogin.addEventListener('click', () => {
    signInWithPopup(auth, provider).then((result) => {
      const credential = GithubAuthProvider.credentialFromResult(result);
      ghToken = credential.accessToken;
      ghUser = result.user.reloadUserInfo.screenName;
      initIDE();
    }).catch(err => {
      showToast("Login failed: " + err.message, true);
    });
  });

  ui.btnLogout.addEventListener('click', () => {
    signOut(auth).then(() => {
      window.location.reload();
    });
  });

  onAuthStateChanged(auth, (user) => {
      if (user) {
         // Since Firebase doesn't persist the GitHub token across page reloads by default,
         // we force a re-login if the page refreshes during the sprint. 
         // For a 2.5 hour sprint, keeping it in memory is safest.
         if (!ghToken) {
             // Temporarily bypassed for UI editing
         }
      }
    });

  // IDE Init
  async function initIDE() {
    ui.loginScreen.style.display = 'none';
    ui.appLayout.style.display = 'flex';
    ui.userDisplay.textContent = `@${ghUser}`;
    await fetchRepos();
  }

  // GitHub API Interactions
  async function fetchRepos() {
    try {
      log('Fetching repositories...');
      const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=50', {
        headers: { Authorization: `token ${ghToken}` }
      });
      if (!res.ok) throw new Error("Failed to fetch repos");
      const repos = await res.json();
      
      ui.repoSelect.innerHTML = '<option value="">-- Select Repo --</option>';
      repos.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.full_name;
        opt.textContent = r.name;
        ui.repoSelect.appendChild(opt);
      });

      if(repos.length > 0) {
        ui.repoSelect.value = repos[0].full_name;
        await loadRepo(repos[0].full_name);
      }
    } catch (err) {
      log(err.message, 'err');
    }
  }

  ui.repoSelect.addEventListener('change', async (e) => {
    if (e.target.value) await loadRepo(e.target.value);
  });

  async function loadRepo(repoFullName) {
    currentRepo = repoFullName;
        currentFile = '';
        setDirty(false);
    sourceContent = '';
    ui.codeEditor.value = '';
    renderPreview('');
    ui.btnLiveSite.style.display = 'inline-flex';
    
    try {
      log(`Loading tree for ${repoFullName}...`);
      const res = await fetch(`https://api.github.com/repos/${currentRepo}/git/trees/main?recursive=1`, {
        headers: { Authorization: `token ${ghToken}` }
      });
      if (!res.ok) throw new Error("Tree fetch failed (branch might not be 'main')");
      const data = await res.json();
      fileTree = data.tree.filter(t => t.type === 'blob');
      renderFileTree();
      
      // Auto-load index.html if it exists
      const indexFile = fileTree.find(f => f.path === 'index.html');
      if (indexFile) await loadFile('index.html');
      
    } catch (err) {
      log(err.message, 'err');
      ui.fileTree.innerHTML = '<div style="padding:10px; color:#ff7b72;">Failed to load tree.</div>';
    }
  }

  function fileIcon(path) {
      const ext = (path.split('.').pop() || '').toLowerCase();
      const map = { html: '🌐', htm: '🌐', css: '🎨', js: '📜', json: '🧾', md: '📝', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', svg: '🖼️' };
      return map[ext] || '📄';
    }

    function renderFileTree() {
      ui.fileTree.querySelectorAll('.file-item').forEach(el => { el.onclick = null; });
      ui.fileTree.innerHTML = '';
    fileTree.forEach(f => {
      const div = document.createElement('div');
      div.className = `file-item ${f.path === currentFile ? 'active' : ''}`;
      const slash = f.path.lastIndexOf('/');
            const ico = document.createElement('span');
            ico.className = 'fi-icon';
            ico.textContent = fileIcon(f.path);
            const nm = document.createElement('span');
            nm.className = 'fi-name';
            nm.textContent = f.path.slice(slash + 1);
            div.title = f.path;
            div.appendChild(ico);
            div.appendChild(nm);
            if (slash !== -1) {
              const dr = document.createElement('span');
              dr.className = 'fi-dir';
              dr.textContent = f.path.slice(0, slash + 1);
              div.appendChild(dr);
            }
      div.onclick = () => loadFile(f.path);
      ui.fileTree.appendChild(div);
    });
  }

  async function loadFile(path) {
    if(!currentRepo) return;
    try {
      log(`Fetching ${path}...`);
      const res = await fetch(`https://api.github.com/repos/${currentRepo}/contents/${path}?ref=main`, {
        headers: { Authorization: `token ${ghToken}` }
      });
      if (!res.ok) throw new Error(`Could not load ${path}`);
      const data = await res.json();
      
      sourceContent = base64ToUnicode(data.content);
      currentFile = path;
            setDirty(false);
      ui.codeEditor.value = sourceContent;
      ui.btnPush.disabled = false;
      
      renderFileTree();
      renderPreview(sourceContent);
      log(`Loaded ${path}`, 'success');
    } catch (err) {
      log(err.message, 'err');
    }
  }

  // Quick Repo Creation
  ui.btnNewRepo.addEventListener('click', async () => {
    const repoName = prompt("Enter new repository name (e.g., sprint-app-1):");
    if (!repoName) return;
    
    try {
      log(`Creating repository: ${repoName}...`);
      const res = await fetch('https://api.github.com/user/repos', {
        method: 'POST',
        headers: { Authorization: `token ${ghToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: repoName, private: false, auto_init: true })
      });
      if (!res.ok) throw new Error(await res.text());
      const repoData = await res.json();
      
      log('Committing base index.html...');
      const baseContent = unicodeToBase64("<!DOCTYPE html>\n<html>\n<head>\n<title>Vibe App</title>\n</head>\n<body>\n  <h1>Hello Vibe!</h1>\n</body>\n</html>");
      await fetch(`https://api.github.com/repos/${repoData.full_name}/contents/index.html`, {
        method: 'PUT',
        headers: { Authorization: `token ${ghToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: "Initial commit", content: baseContent, branch: "main" })
      });

      log('Enabling GitHub Pages...');
      await fetch(`https://api.github.com/repos/${repoData.full_name}/pages`, {
        method: 'POST',
        headers: { Authorization: `token ${ghToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: { branch: 'main', path: '/' } })
      });

      showToast("Repository created successfully!");
      await fetchRepos();
      ui.repoSelect.value = repoData.full_name;
      await loadRepo(repoData.full_name);

    } catch (err) {
      log("Repo creation failed: " + err.message, 'err');
      showToast("Error creating repo", true);
    }
  });

  // Push to Live (Commit)
  ui.btnPush.addEventListener('click', async () => {
    if (!currentRepo || !currentFile) return;
    ui.btnPush.disabled = true;
    ui.btnPush.textContent = "⏳ Pushing...";
    
    try {
      // Get SHA of current file
      const getRes = await fetch(`https://api.github.com/repos/${currentRepo}/contents/${currentFile}?ref=main`, {
        headers: { Authorization: `token ${ghToken}` }
      });
      const getData = await getRes.json();
      const sha = getData.sha;

      // Put new content
      const putRes = await fetch(`https://api.github.com/repos/${currentRepo}/contents/${currentFile}`, {
        method: 'PUT',
        headers: { Authorization: `token ${ghToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Update ${currentFile} via Vibe Sprint`,
          content: unicodeToBase64(sourceContent),
          sha: sha,
          branch: 'main'
        })
      });

      if (!putRes.ok) throw new Error(await putRes.text());
      
      setDirty(false);
            log(`Committed ${currentFile} to main.`, 'success');
      showToast("Code pushed! Site will update in ~30s.");
    } catch (err) {
      log("Push failed: " + err.message, 'err');
      showToast("Failed to push", true);
    } finally {
      ui.btnPush.disabled = false;
      ui.btnPush.textContent = "💾 Push";
    }
  });

  ui.btnLiveSite.addEventListener('click', () => {
    if(!currentRepo) return;
    const repoName = currentRepo.split('/')[1];
    window.open(`https://${ghUser}.github.io/${repoName}/`, '_blank');
  });

  // New File
    ui.btnNewFile.addEventListener('click', async () => {
      if (!currentRepo) {
        showToast("Select a repo first!", true);
        return;
      }
      const entered = prompt("New file path (e.g., style.css or js/app.js):");
      if (!entered || !entered.trim()) return;
      let cleanPath = entered.trim();
      while (cleanPath.charAt(0) === '/') cleanPath = cleanPath.slice(1);
      if (!cleanPath) return;
      const fileUrl = ['https:', '', 'api.github.com', 'repos', currentRepo, 'contents', cleanPath].join('/');
      try {
        log('Creating ' + cleanPath + '...');
        const res = await fetch(fileUrl, {
          method: 'PUT',
          headers: { Authorization: 'token ' + ghToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Create ' + cleanPath + ' via Vibe Sprint', content: unicodeToBase64(''), branch: 'main' })
        });
        if (!res.ok) throw new Error(await res.text());
        fileTree.push({ path: cleanPath, type: 'blob' });
        fileTree.sort((a, b) => a.path.localeCompare(b.path));
        await loadFile(cleanPath);
        showToast("File created!");
      } catch (err) {
        log("File creation failed: " + err.message, 'err');
        showToast("Error creating file", true);
      }
    });

    // View Toggles
  ui.tabPreview.addEventListener('click', () => {
    ui.tabPreview.classList.add('active');
    ui.tabCode.classList.remove('active');
    ui.previewFrame.style.display = 'block';
    ui.codeEditor.style.display = 'none';
  });

  ui.tabCode.addEventListener('click', () => {
    ui.tabCode.classList.add('active');
    ui.tabPreview.classList.remove('active');
    ui.codeEditor.style.display = 'block';
    ui.previewFrame.style.display = 'none';
    ui.codeEditor.value = sourceContent;
  });

  // Iframe Error Interception Bridge
  const bridgeScript = `
    <script>
      window.onerror = function(msg, url, line, col, error) {
        window.parent.postMessage({ type: 'vibe_error', msg: 'Line ' + line + ': ' + msg }, '*');
        return true;
      };
      window.addEventListener("unhandledrejection", function(e) {
        window.parent.postMessage({ type: 'vibe_error', msg: 'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : 'Unknown') }, '*');
      });
    <\/script>
  `;

  function renderPreview(code) {
    ui.watermark.style.display = code ? 'none' : 'flex';
    if (!code) {
      ui.previewFrame.srcdoc = '';
      return;
    }
    const safeHtml = code.replace(/(<head[^>]*>)/i, `$1\n${bridgeScript}`);
    // Fallback if no head tag exists
    ui.previewFrame.srcdoc = safeHtml.includes('<head') ? safeHtml : bridgeScript + safeHtml;
  }

  // Catch errors from iframe
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'vibe_error') {
      log(`Runtime Error: ${e.data.msg}`, 'err');
    }
  });

  ui.btnClearLogs.addEventListener('click', () => {
      ui.consoleLogs.innerHTML = '';
      updateErrCount();
    });

    ui.btnToggleSidebar.addEventListener('click', () => {
      ui.sidebar.classList.toggle('collapsed');
    });

    ui.btnCopyErrors.addEventListener('click', () => {
    const errors = Array.from(document.querySelectorAll('.log-err')).map(el => el.textContent).join('\\n');
    if (!errors) {
      showToast("No errors to copy!");
      return;
    }
    navigator.clipboard.writeText(`I am getting these console errors:\\n${errors}\\n\\nPlease fix the code.`).then(() => {
      showToast("Copied prompt for AI!");
    });
  });

  /* =========================================================================
     THE VIBE PASTE ENGINE (Atomic Block Parser)
     ========================================================================= */
  
  function fixEncoding(src) {
    if (!src) return '';
    return src.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
  }

  function parseBlocks(rawText) {
    // Normalise tokens
    let cleaned = rawText
      .replace(/={2,4}\s*SPLIT\s*={2,4}/gi, '===SPLIT===')
      .replace(/={2,4}\s*BLOCK\s*={2,4}/gi, '===BLOCK===')
      .replace(/^[ \t]*```[a-zA-Z0-9_\-]*\r?\n/gm, '')
      .replace(/^[ \t]*```[ \t]*(\r?\n|$)/gm, '');

    const units = cleaned.split('===BLOCK===').map(u => u.trim()).filter(Boolean);
    const blocks = [];

    units.forEach(u => {
      if (!u.includes('===SPLIT===')) return;
      const parts = u.split('===SPLIT===');
      const oldCode = parts[0].trim();
      const newCode = parts[1].trim();
      if (oldCode || newCode) blocks.push({ oldCode, newCode });
    });
    return blocks;
  }

  function applyBlock(source, block) {
    const cleanOld = block.oldCode.replace(/\r\n/g, '\n');
    const cleanNew = fixEncoding(block.newCode.replace(/\r\n/g, '\n'));

    // Exact Match Fallback finding
    const idx = source.indexOf(cleanOld);
    if (idx !== -1) {
      return source.slice(0, idx) + cleanNew + source.slice(idx + cleanOld.length);
    }

    // Whitespace-agnostic fuzzy match (safe simple tier)
    const escOld = cleanOld.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      const rx = new RegExp(escOld);
      const match = source.match(rx);
      if (match && match.index !== undefined) {
        return source.slice(0, match.index) + cleanNew + source.slice(match.index + match[0].length);
      }
    } catch(e) {}

    throw new Error(`Could not find the target code in the file. Ensure the AI output matches exactly.`);
  }

  async function handlePaste() {
    if (!currentFile) {
      showToast("Select a file first!", true);
      return;
    }
    
    let raw = "";
    try {
      raw = await navigator.clipboard.readText();
    } catch (err) {
      showToast("Clipboard permission denied. Press Ctrl+V instead.", true);
      return;
    }

    if (!raw.trim()) return;

    // Full file initialization bypass
    if (!sourceContent && (raw.includes('<!DOCTYPE') || raw.includes('<html'))) {
      sourceContent = fixEncoding(raw);
      renderPreview(sourceContent);
      ui.codeEditor.value = sourceContent;
      ui.btnPush.disabled = false;
      setDirty(true);
            log('Initialised file from clipboard.', 'success');
      showToast("Code pasted successfully!");
      return;
    }

    // Block Processing
    const blocks = parseBlocks(raw);
    if (blocks.length === 0) {
      log('No ===SPLIT=== blocks found. If pasting a full file, clear the editor first.', 'err');
      showToast("Invalid AI Patch format", true);
      return;
    }

    let stagingContent = sourceContent;
    try {
      blocks.forEach((b, i) => {
        stagingContent = applyBlock(stagingContent, b);
      });
      
      sourceContent = stagingContent;
      renderPreview(sourceContent);
      ui.codeEditor.value = sourceContent;
      setDirty(true);
            log(`Applied ${blocks.length} patch(es) successfully.`, 'success');
      showToast("AI Fix Applied!");
      
    } catch (err) {
      log(`Patch failed: ${err.message}`, 'err');
      showToast("Failed to apply patch", true);
    }
  }

  ui.btnPasteAi.addEventListener('click', handlePaste);

  // Manual Paste Fallback
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'v' && e.shiftKey) {
      e.preventDefault();
      handlePaste();
    }
  });

</script>
</body>
</html>
