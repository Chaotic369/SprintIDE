<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint IDE</title>
<style>
  :root {
    --bg-dark: #0a0a0c;
    --bg-panel: #111215;
    --bg-header: #16181d;
    --accent-blue: #5c9dff;
    --accent-green: #39d353;
    --accent-red: #f85149;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --border: #262c36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Buttons */
  button { background: #1c2128; color: var(--text-main); border: 1px solid var(--border); padding: 4px 9px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; transition: 0.15s; }
  button:hover:not(:disabled) { background: #2d333b; border-color: #444c56; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: #238636; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
  button.primary:hover:not(:disabled) { background: #2ea043; }
  button.danger { color: var(--accent-red); border-color: rgba(248,81,73,0.25); background: rgba(248,81,73,0.08); }
  button.danger:hover:not(:disabled) { background: rgba(248,81,73,0.18); border-color: var(--accent-red); }
  
  /* Layout */
  #login-screen { display: none !important; }
  #app-layout { display: flex; flex-direction: column; height: 100vh; }
  
  #header { height: 34px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; justify-content: space-between; flex-shrink: 0; gap: 8px; }
  .brand-tag { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.5px; padding-right: 6px; border-right: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
  .header-group { display: flex; gap: 6px; align-items: center; min-width: 0; }
  select { background: #0d1117; color: #fff; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-size: 11px; outline: none; height: 24px; max-width: 150px; }

  #workspace { display: flex; flex: 1; min-height: 0; }
  
  /* Sidebar */
  #sidebar { width: 170px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 4px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  #file-tree { flex: 1; overflow-y: auto; padding: 4px 0; }
  .file-item { padding: 3px 8px; overflow: hidden; white-space: nowrap; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-muted); user-select: none; border-left: 2px solid transparent; }
  .file-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .file-item.active { background: rgba(92,157,255,0.12); color: var(--accent-blue); border-left-color: var(--accent-blue); }

  /* Main Editor Area */
  #main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #editor-tabs { height: 30px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 6px; gap: 4px; flex-shrink: 0; }
  .tab-group { display: flex; background: #0a0a0c; border: 1px solid var(--border); border-radius: 4px; padding: 2px; gap: 2px; }
  .tab-btn { background: transparent; border: none; padding: 3px 8px; color: var(--text-muted); border-radius: 3px; font-size: 11px; font-weight: 500; }
  .tab-btn.active { color: #fff; background: #21262d; }
  
  #view-container { flex: 1; position: relative; display: flex; min-height: 0; }
  #code-editor { position: absolute; inset: 0; width: 100%; height: 100%; background: #0a0a0c; color: #e6edf3; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.45; padding: 8px 10px 30px; border: none; resize: none; outline: none; display: none; tab-size: 2; }
  #preview-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #fff; display: block; }
  
  /* Console */
  #console-panel { height: 96px; background: #0d1117; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #console-header { padding: 3px 8px; background: #161b22; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  #console-logs { flex: 1; overflow-y: auto; padding: 6px 10px; font-family: monospace; font-size: 10px; line-height: 1.35; color: #e6edf3; }
  .log-err { color: #ff7b72; margin-bottom: 2px; border-left: 2px solid #ff7b72; padding: 2px 6px; background: rgba(255,123,114,0.1); border-radius: 2px; }
  .log-info { color: var(--accent-blue); margin-bottom: 2px; }
  .log-success { color: var(--accent-green); margin-bottom: 2px; }
  
  /* Overlays & Utilities */
  #toast { position: fixed; bottom: 16px; right: 16px; background: var(--bg-panel); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 500; transform: translateY(80px); opacity: 0; transition: 0.25s; z-index: 10000; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  #toast.show { transform: translateY(0); opacity: 1; }
  .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; background: var(--bg-dark); font-size: 12px; color: var(--text-muted); pointer-events: none; text-align: center; line-height: 1.4; padding: 20px; }
    #sidebar.collapsed { display: none; }
    #user-display { font-size: 11px; color: var(--text-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.ai-btn { background: var(--accent-blue); color: #fff; font-size: 10px; font-weight: 600; padding: 3px 9px; border: 1px solid rgba(255,255,255,0.1); }
    button.ai-btn:hover:not(:disabled) { background: #7ab1ff; border-color: rgba(255,255,255,0.25); }
    button.icon-btn { padding: 3px 7px; font-size: 12px; line-height: 1; }
    button.mini { padding: 2px 7px; font-size: 10px; }
    #current-file-label { font-size: 11px; color: var(--text-muted); margin-left: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #current-file-label.dirty { color: #e3b341; }
    .badge { background: var(--accent-red); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 9px; font-weight: 700; margin-left: 6px; }
    .console-actions { display: flex; gap: 4px; }
    .fi-icon { flex-shrink: 0; font-size: 11px; }
    .fi-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .fi-dir { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #5b6470; font-size: 9px; }
      #ai-bar { display: flex; gap: 6px; align-items: center; padding: 4px 6px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
      #ai-instruction { flex: 1; min-width: 0; background: #0d1117; color: var(--text-main); border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; height: 24px; font-size: 11px; outline: none; }
      #ai-instruction:focus { border-color: var(--accent-blue); }
        #editor-status { display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; align-items: center; gap: 12px; padding: 3px 10px; background: var(--bg-header); border-top: 1px solid var(--border); font-size: 10px; color: var(--text-muted); }
        #editor-status .sp { flex: 1; }
        #editor-status button.mini { padding: 1px 6px; }
        #editor-hint { color: #5b6470; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
          .cnt { font-size: 9px; font-weight: 700; min-width: 12px; text-align: center; color: var(--text-muted); margin-left: 2px; }
          button.hist:not(:disabled) .cnt { color: var(--accent-blue); }
            .resizer { flex-shrink: 0; background: var(--border); position: relative; z-index: 4; transition: background 0.15s; touch-action: none; }
            .resizer.v { width: 4px; cursor: col-resize; }
            .resizer.h { height: 4px; cursor: row-resize; }
            .resizer.v::after { content: ""; position: absolute; top: 0; bottom: 0; left: -3px; right: -3px; }
            .resizer.h::after { content: ""; position: absolute; left: 0; right: 0; top: -3px; bottom: -3px; }
            .resizer:hover, .resizer.dragging { background: var(--accent-blue); }
            body.resizing { user-select: none; }
            body.resizing-v { cursor: col-resize; }
            body.resizing-h { cursor: row-resize; }
            #sidebar.collapsed + #resize-sidebar { display: none; }
              #btn-toggle-sidebar .i-expand { display: none; }
              #btn-toggle-sidebar.is-collapsed .i-collapse { display: none; }
              #btn-toggle-sidebar.is-collapsed .i-expand { display: inline; }
        .ico { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .brand-tag .ico { color: var(--accent-blue); }
        .file-item .fi-icon { display: inline-flex; align-items: center; }
        #btn-exit-full { display: none; position: absolute; top: 8px; right: 8px; z-index: 5; opacity: 0.85; }
        #btn-exit-full:hover { opacity: 1; }
        #view-container:fullscreen { background: var(--bg-dark); }
        #view-container.pseudo-full { position: fixed; inset: 0; z-index: 9000; background: var(--bg-dark); }
        #view-container:fullscreen #btn-exit-full, #view-container.pseudo-full #btn-exit-full { display: inline-flex; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <h2>Vibe Sprint IDE</h2>
  <p style="color: var(--text-muted); font-size: 14px;">Log in to authenticate your GitHub deployment pipeline.</p>
  <button id="btn-login" class="primary" style="padding: 12px 24px; font-size: 14px;">Sign in with GitHub</button>
</div>

<!-- Main App Layout -->
<div id="app-layout">
  <div id="header">
    <div class="header-group">
          <span class="brand-tag"><svg class="ico" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Sprint IDE</span>
      <select id="repo-select" title="Select Repository"><option value="">Loading Repos...</option></select>
      <button id="btn-new-repo" title="Create New Repository"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
      <button id="btn-live-site" title="Open the live GitHub Pages site in a new tab"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></svg>Live Site</button>
    </div>
    <div class="header-group">
          <span id="user-display" title="GitHub user (signed in)"></span>
      <button id="btn-push" class="primary" disabled title="Commit and deploy changes"><svg class="ico" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg><span id="push-label">Push</span></button>
      <button id="btn-logout" class="danger"><svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Logout</button>
    </div>
  </div>

  <div id="workspace">
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Explorer</span>
        <button id="btn-new-file" class="mini" title="Create a new file in this repo"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>File</button>
      </div>
      <div id="file-tree"></div>
    </div>
    
    <div id="resize-sidebar" class="resizer v" title="Drag to resize Explorer, double-click to reset"></div>
        <div id="main-area">
      <div id="editor-tabs">
              <button id="btn-toggle-sidebar" class="icon-btn" title="Hide Explorer"><svg class="ico i-collapse" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><svg class="ico i-expand" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
              <div class="tab-group">
          <button id="tab-preview" class="tab-btn active">Preview</button>
          <button id="tab-code" class="tab-btn">Code</button>
                  </div>
                  <span id="current-file-label">No file open</span>
                  <div style="flex:1;"></div>
        <button id="btn-undo" class="icon-btn hist" disabled title="Undo (Ctrl+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span id="undo-count" class="cnt">0</span></button>
                <button id="btn-redo" class="icon-btn hist" disabled title="Redo (Ctrl+Y)"><svg class="ico" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span id="redo-count" class="cnt">0</span></button>
                <button id="btn-fullscreen" class="icon-btn" title="Fullscreen the preview and code area"><svg class="ico" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
                <button id="btn-paste-ai" class="ai-btn" title="Apply an AI patch from the clipboard (Ctrl+Shift+V)"><svg class="ico" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Paste AI Fix</button>
      </div>
      
      <div id="ai-bar">
              <input id="ai-instruction" type="text" placeholder="Describe the change you want, then press Enter or click Copy Prompt" autocomplete="off" spellcheck="false">
              <button id="btn-copy-prompt" class="primary mini" title="Copy rules, scenarios, your instruction and the current file for the AI"><svg class="ico" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Copy Prompt</button>
            </div>
            <div id="view-container">
        <button id="btn-exit-full" class="mini" title="Exit fullscreen"><svg class="ico" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>Exit</button>
                <div id="empty-watermark" class="watermark">Generate your app with AI,<br>copy the code, and click 'Paste AI Fix'</div>
        <textarea id="code-editor" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
                <div id="editor-status">
                  <span id="status-pos">Ln 1, Col 1</span>
                  <span id="editor-hint">Tab indent | Shift+Tab outdent | Ctrl+S push | Ctrl+Z undo | Ctrl+Y redo</span>
                  <span class="sp"></span>
                  <button id="btn-wrap" class="mini" title="Toggle word wrap">Wrap: off</button>
                </div>
      </div>
      
      <div id="resize-console" class="resizer h" title="Drag to resize Terminal, double-click to reset"></div>
            <div id="console-panel">
        <div id="console-header">
          <span>Terminal / Error Logs<span id="err-count" class="badge" style="display:none;">0</span></span>
                    <div class="console-actions">
                      <button id="btn-clear-logs" class="mini" title="Clear all logs"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>Clear</button>
                      <button id="btn-copy-errors" class="mini" title="Copy errors as a ready-to-paste AI prompt"><svg class="ico" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Copy Logs for AI</button>
                    </div>
        </div>
        <div id="console-logs"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GithubAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCsN9OHN4SKKzMvaUnWPGUHK4VrJICL-Eo",
    authDomain: "ghub-fcc39.firebaseapp.com",
    projectId: "ghub-fcc39"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GithubAuthProvider();
  provider.addScope('repo'); // Required to read/write repositories

  // State
  let ghToken = '';
  let ghUser = '';
  let currentRepo = '';
  let currentFile = '';
  let sourceContent = '';
  let fileTree = [];
    let previewStale = false;
      let undoStack = [];
      let redoStack = [];
      let lastSnap = '';
      let typingTimer = null;
      const HIST_MAX = 100;

  // DOM Elements
  const ui = {
    loginScreen: document.getElementById('login-screen'),
    appLayout: document.getElementById('app-layout'),
    btnLogin: document.getElementById('btn-login'),
    btnLogout: document.getElementById('btn-logout'),
    userDisplay: document.getElementById('user-display'),
    repoSelect: document.getElementById('repo-select'),
    btnNewRepo: document.getElementById('btn-new-repo'),
    btnPush: document.getElementById('btn-push'),
        pushLabel: document.getElementById('push-label'),
        btnFull: document.getElementById('btn-fullscreen'),
        btnExitFull: document.getElementById('btn-exit-full'),
        viewContainer: document.getElementById('view-container'),
    btnPasteAi: document.getElementById('btn-paste-ai'),
        btnCopyPrompt: document.getElementById('btn-copy-prompt'),
            aiInput: document.getElementById('ai-instruction'),
    btnLiveSite: document.getElementById('btn-live-site'),
    btnNewFile: document.getElementById('btn-new-file'),
    fileTree: document.getElementById('file-tree'),
    tabPreview: document.getElementById('tab-preview'),
    tabCode: document.getElementById('tab-code'),
    codeEditor: document.getElementById('code-editor'),
    previewFrame: document.getElementById('preview-frame'),
    watermark: document.getElementById('empty-watermark'),
    consoleLogs: document.getElementById('console-logs'),
    btnCopyErrors: document.getElementById('btn-copy-errors'),
        btnClearLogs: document.getElementById('btn-clear-logs'),
        errCount: document.getElementById('err-count'),
        sidebar: document.getElementById('sidebar'),
        btnToggleSidebar: document.getElementById('btn-toggle-sidebar'),
        fileLabel: document.getElementById('current-file-label'),
        statusPos: document.getElementById('status-pos'),
            consolePanel: document.getElementById('console-panel'),
            resizeSidebar: document.getElementById('resize-sidebar'),
            resizeConsole: document.getElementById('resize-console'),
            btnUndo: document.getElementById('btn-undo'),
            btnRedo: document.getElementById('btn-redo'),
            undoCount: document.getElementById('undo-count'),
            redoCount: document.getElementById('redo-count'),
            editorStatus: document.getElementById('editor-status'),
            btnWrap: document.getElementById('btn-wrap'),
            toast: document.getElementById('toast')
  };

  // Utilities
  function showToast(msg, isError = false) {
    ui.toast.textContent = msg;
    ui.toast.style.borderColor = isError ? 'var(--accent-red)' : 'var(--border)';
    ui.toast.classList.add('show');
    setTimeout(() => ui.toast.classList.remove('show'), 3000);
  }

  function log(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `log-${type}`;
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    ui.consoleLogs.appendChild(el);
        ui.consoleLogs.scrollTop = ui.consoleLogs.scrollHeight;
        if (type === 'err') updateErrCount();
      }

      function updateErrCount() {
        const n = ui.consoleLogs.querySelectorAll('.log-err').length;
        ui.errCount.textContent = n;
        ui.errCount.style.display = n ? 'inline-block' : 'none';
      }

      function setDirty(flag) {
        ui.fileLabel.textContent = currentFile ? currentFile + (flag ? ' ●' : '') : 'No file open';
        ui.fileLabel.classList.toggle('dirty', !!flag);
      }

  function svgIcon(inner, color) {
      return '<svg class="ico" viewBox="0 0 24 24"' + (color ? ' style="color:' + color + '"' : '') + '>' + inner + '</svg>';
    }

    const ICON_PAGE = '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>';
    const ICON_TEXT = ICON_PAGE + '<path d="M9 13h6M9 17h6"/>';
    const ICON_CODE = '<path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/>';
    const ICON_HASH = '<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>';
    const ICON_BRACES = '<path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/>';
    const ICON_IMG = '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-4-4L5 21"/>';
    const DEFAULT_FILE_ICON = svgIcon(ICON_PAGE, '');
    const FILE_ICONS = {
      html: svgIcon(ICON_CODE, '#e8825b'),
      htm: svgIcon(ICON_CODE, '#e8825b'),
      css: svgIcon(ICON_HASH, '#5c9dff'),
      js: svgIcon(ICON_BRACES, '#e3b341'),
      json: svgIcon(ICON_BRACES, '#39d353'),
      md: svgIcon(ICON_TEXT, '#8b949e'),
      txt: svgIcon(ICON_TEXT, '#8b949e'),
      png: svgIcon(ICON_IMG, '#a371f7'),
      jpg: svgIcon(ICON_IMG, '#a371f7'),
      jpeg: svgIcon(ICON_IMG, '#a371f7'),
      gif: svgIcon(ICON_IMG, '#a371f7'),
      webp: svgIcon(ICON_IMG, '#a371f7'),
      svg: svgIcon(ICON_IMG, '#a371f7')
    };

    function unicodeToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function base64ToUnicode(b64) {
    return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
  }

  // Auth Flow
  ui.btnLogin.addEventListener('click', () => {
    signInWithPopup(auth, provider).then((result) => {
      const credential = GithubAuthProvider.credentialFromResult(result);

  /* =========================================================================
     THE VIBE PASTE ENGINE (Atomic Block Parser)

  function fixEncoding(src) {
    if (!src) return '';
    return src.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
  }

  function parseBlocks(rawText) {
    // Normalise tokens
    let cleaned = rawText
      .replace(/={2,4}\s*SPLIT\s*={2,4}/gi, '===SPLIT===')
      .replace(/={2,4}\s*BLOCK\s*={2,4}/gi, '===BLOCK===')
      .replace(/^[ \t]*```[a-zA-Z0-9_\-]*\r?\n/gm, '')
      .replace(/^[ \t]*```[ \t]*(\r?\n|$)/gm, '');

    const units = cleaned.split('===BLOCK===').map(u => u.trim()).filter(Boolean);
    const blocks = [];

    units.forEach(u => {
      if (!u.includes('===SPLIT===')) return;
      const parts = u.split('===SPLIT===');
      const oldCode = parts[0].trim();
      const newCode = parts[1].trim();
      if (oldCode || newCode) blocks.push({ oldCode, newCode });
    });
    return blocks;
  }

  function applyBlock(source, block) {
    const cleanOld = block.oldCode.replace(/\r\n/g, '\n');
    const cleanNew = fixEncoding(block.newCode.replace(/\r\n/g, '\n'));

    // Exact Match Fallback finding
    const idx = source.indexOf(cleanOld);
    if (idx !== -1) {
      return source.slice(0, idx) + cleanNew + source.slice(idx + cleanOld.length);
    }

    // Whitespace-agnostic fuzzy match (safe simple tier)
    const escOld = cleanOld.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      const rx = new RegExp(escOld);
      const match = source.match(rx);
      if (match && match.index !== undefined) {
        return source.slice(0, match.index) + cleanNew + source.slice(match.index + match[0].length);
      }
    } catch(e) {}

    throw new Error(`Could not find the target code in the file. Ensure the AI output matches exactly.`);
  }

    }

    if (blocks.length === 0) {
      log('No ===SPLIT=== blocks found. If pasting a full file, clear the editor first.', 'err');
      showToast("Invalid AI Patch format", true);
      return;

      ui.codeEditor.value = sourceContent;
      setDirty(true);

      'Give me the results as Combined Find-and-Replace blocks. Put the old code and the new code inside a single code block separated by exactly ' + EQ3 + 'SPLIT' + EQ3 + ' on its own line so I only have to click copy once.',
      '',
      'The 20 Surgery Scenarios You Must Handle:',
      'Scenario 1 (The Swap): Just changing one value or line for another.',
      'Scenario 2 (The Excision): Deleting code while keeping the rest of the file clean. The NEW block must be completely empty - no placeholder comment, no blank lines, nothing.',
      'Scenario 3 (The Injection): Bolting on brand new features to existing code.',
      'Scenario 4 (The Interceptor): Adding a safety check or a rule inside an existing process.',
      'Scenario 5 (The Migration): Moving a button or a piece of logic from one place to another.',
      'Scenario 6 (The Refactor): Rewriting a complex math formula or a loop to make it faster.',
      'Scenario 7 (The Sweep): Renaming a specific word or variable everywhere it appears.',
      'Scenario 8 (The Database Bump): Updating saved data settings so the app does not crash on old info.',
      'Scenario 9 (The Link Shift): Changing where the app connects to (APIs, URLs, or Tokens).',
      'Scenario 10 (The Sync): If you change the Brain (Web Worker), you must also fix the Body (Main Script).',
      'Scenario 11 (The Layer Fix): Fixing UI issues where things are hidden or unclickable.',
      'Scenario 12 (The Attribute Patch): For changes inside an HTML tag attributes (style, class, data-*), include only that specific tag as the OLD block.',
      'Scenario 13 (The Nuke Warning): If the requested change requires replacing more than 60 percent of the file, state that in plain text before any code block, then ask for confirmation.',
      'Scenario 14 (The Encoding Fix): If pasted code contains garbled unicode, mojibake, or HTML entities used as code, restore the correct characters before applying.',
      'Scenario 15 (The Dedup): If a variable or function is defined more than once in the same scope after your edit, remove the duplicate. Never declare the same identifier twice.',
      'Scenario 16 (The Guard Wrap): If adding async/await or Promise chains, always add catch or try/catch - never leave a Promise unhandled.',
      'Scenario 17 (The CSS Cascade Fix): When fixing a style, check if the same property is set elsewhere (inline style, other rule) and neutralize the conflict.',
      'Scenario 18 (The Event Leak): If removing or replacing a DOM element that had event listeners, ensure the listeners are removed first to prevent memory leaks.',
      'Scenario 19 (The Scope Escape): If any variable declared inside a function or block with const or let gets re-executed, move it outside or convert to var.',
      'Scenario 20 (The Rollback Hook): If your patch changes critical state logic (localStorage keys, data schema, core calculations), output a second ' + EQ3 + 'BLOCK' + EQ3 + ' that is the reverse patch so it can be undone cleanly.',
      '',
      'Strict Code Rules:',
      '- Never convert inline script tags to external script tags with a src attribute. All JS must stay inline.',
      '- If the OLD block text appears more than once in the file, expand it to include enough surrounding lines to make it uniquely identifiable.',
      '- Never reformat or change indentation style. Match the existing tabs and spaces exactly.',
      '- The string ' + EQ3 + 'SPLIT' + EQ3 + ' must never appear inside the OLD or NEW code itself.',
      '- Never leave any curly brace or parenthesis unclosed.',
      '- Never add import or require statements unless the environment already uses modules.',
      '- Never remove error handling that already exists.',
      '- Preserve all existing comments unless asked to remove them.',
      '',
      'Output Rules:',
      '- Response must contain ONLY the code block(s). No warnings, no annotations, no symbols.',
      '- If you have a concern about the existing code, state it in plain text BEFORE the code block.',
      '- For multiple independent fixes, separate each OLD' + EQ3 + 'SPLIT' + EQ3 + 'NEW pair with ' + EQ3 + 'BLOCK' + EQ3 + '.'
    ].join('\n');

    ui.btnCopyPrompt.addEventListener('click', () => {
      if (!currentFile) {
        showToast("Open a file first!", true);
        return;
      }
      const wanted = ui.aiInput.value;
          if (!wanted.trim()) {
            showToast("Type what the AI should change in the bar first!", true);
            ui.aiInput.focus();
            return;
          }
      const full = PROMPT_HEAD + '\n\n=== INSTRUCTIONS ===\n' + (wanted.trim() || '(none given)') + '\n\n=== CURRENT SOURCE ===\n' + sourceContent;
      navigator.clipboard.writeText(full).then(() => {
        showToast("Prompt + file copied for AI!");
        log('Copied AI prompt (' + full.length + ' chars).', 'success');
      }).catch(() => {
        showToast("Clipboard blocked - could not copy", true);
      });
    });

    ui.aiInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          ui.btnCopyPrompt.click();
        }
      });

      ui.btnPasteAi.addEventListener('click', handlePaste);

  // Manual Paste Fallback
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'v' && e.shiftKey) {
      e.preventDefault();
      handlePaste();
    }
  });

</script>
</body>
</html>
